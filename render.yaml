services:
  - type: web
    name: localeyes-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server-production.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # User will input their Neon connection string on Render
      - key: GMAIL_USER
        sync: false # User will input their Gmail address on Render
      - key: GMAIL_APP_PASSWORD
        sync: false # User will input their 16-character Gmail App Password on Render
      - key: ALLOWED_ORIGINS
        sync: false # User will input their Vercel frontend URL on Render
